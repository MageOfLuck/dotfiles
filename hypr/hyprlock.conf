$display = DP-1 # Global Variable
general {
    hide_cursor = true
}

# Sets Background to Set Color
background {
    monitor =
    color = rgb(100f19)
    blur_passes = 0
}

# Date Label
label {
    monitor = $display
    text = cmd[update:60000] date '+%A, %B %-d'
    font_family = Noto Sans Medium
    font_size = 19
    color = rgb(c7b5e9)
    position = -22%, 111
    halign = center
    valign = center
}

# Current Time
label {
    monitor = $display
    text = $TIME12
    font_family = Noto Sans Light
    font_size = 78
    color = rgb(f2edf9)
    position = -22%, 24
    halign = center
    valign = center
}

# Field to Enter Password
input-field {
    monitor = $display
    size = 320, 56
    position = -22%, -98
    halign = center
    valign = center
    rounding = 16
    outline_thickness = 2
    outer_color = rgb(726389)
    inner_color = rgb(211d2e)
    font_color = rgb(f2edf9)
    font_family = Noto Sans
    placeholder_text = Password for $USER
    fail_text = Numpad?
    check_color = rgb(a1d2c4)
    fail_color = rgb(f29aa7)
    capslock_color = rgb(eec383)
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    fade_on_empty = false
}
